spring.config.import=optional:file:.env[.properties]

spring.application.name=user-account-service
server.port=8081

spring.datasource.url=${DB_URL_ACCOUNTS}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

#JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update

#HEALTH MONITORING - ACTUATOR
management.endpoints.web.exposure.include=health, metric, info

#JWT SECURITY CONFIG
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

#EUREKA DISCOVERY CONFIG
eureka.client.server-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

#KAFKA CONFIGURATION
spring.kafka.bootstrap-servers=127.0.0.1:9092

#PRODUCER CONFIGURATION
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type=true

#CONSUMER CONFIGURATION
spring.kafka.consumer.group-id=account-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.type.mapping=com.juanmatiaslopez.transaction_service.Kafka.DTO.BalanceUpdateEvent:com.juanmatiaslopez.user_account_service.kafka.DTO.BalanceUpdateEvent